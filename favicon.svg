<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Gear">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b87ff"/>
      <stop offset="1" stop-color="#62dcff"/>
    </linearGradient>
  </defs>

  <!-- teeth -->
  <g fill="url(#g)">
    <rect x="29" y="2" width="6" height="10" rx="2"/>
    <rect x="29" y="52" width="6" height="10" rx="2"/>
    <rect x="2" y="29" width="10" height="6" rx="2"/>
    <rect x="52" y="29" width="10" height="6" rx="2"/>

    <rect x="46.5" y="7.6" width="6" height="10" rx="2" transform="rotate(45 49.5 12.6)"/>
    <rect x="46.5" y="46.4" width="6" height="10" rx="2" transform="rotate(135 49.5 51.4)"/>
    <rect x="11.5" y="46.4" width="6" height="10" rx="2" transform="rotate(225 14.5 51.4)"/>
    <rect x="11.5" y="7.6" width="6" height="10" rx="2" transform="rotate(315 14.5 12.6)"/>
  </g>

  <!-- gear body -->
  <circle cx="32" cy="32" r="22" fill="url(#g)"/>
  <circle cx="32" cy="32" r="13" fill="#15171b"/>
  <circle cx="32" cy="32" r="6" fill="url(#g)" opacity="0.9"/>
